<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#FFFFFF"/>
  <!-- Bridge deck (black) -->
  <rect x="2" y="14" width="28" height="2" fill="#000000"/>
  <!-- Pillar caps (gray) -->
  <rect x="4" y="16" width="5" height="1.5" fill="#63666A"/>
  <rect x="13" y="16" width="5" height="1.5" fill="#63666A"/>
  <rect x="22" y="16" width="5" height="1.5" fill="#63666A"/>
  <!-- Pillar gold backgrounds -->
  <rect x="4.5" y="17.5" width="4" height="5" fill="#FFCD00"/>
  <rect x="13.5" y="17.5" width="4" height="5" fill="#FFCD00"/>
  <rect x="22.5" y="17.5" width="4" height="5" fill="#FFCD00"/>
