  <rect x="4" y="26.5" width="5" height="1.5" fill="#63666A"/>
  <rect x="13" y="26.5" width="5" height="1.5" fill="#63666A"/>
  <rect x="22" y="26.5" width="5" height="1.5" fill="#63666A"/>
